services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: seismic_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: seismic_redis
    ports:
      - "6379:6379"

volumes:
  db_data:
