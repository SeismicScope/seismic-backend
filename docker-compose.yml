services:
  backend:
    deploy:
      resources:
        limits:
          memory: 2.5GB
    build: .
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@seismic_db:5432/${POSTGRES_DB}
      REDIS_HOST: seismic_redis
      REDIS_PORT: 6379
    depends_on:
      - seismic_db
      - seismic_redis

  seismic_db:
    image: postgis/postgis:15-3.4
    container_name: seismic_db
    shm_size: "512mb"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  seismic_redis:
    image: redis:7
    container_name: seismic_redis
    ports:
      - "6379:6379"

volumes:
  db_data:
